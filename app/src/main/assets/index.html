<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Levain</title>
<style>
:root{
  --bg:#f3efe6;--card:#fffdf8;--card2:#efe8da;--line:#e2d8c6;--text:#2b2620;--muted:#7b7062;
  --accent:#5f7f52;--accent2:#4d6a42;--crust:#a8662d;--good:#5f7f52;--bad:#b4472f;--onaccent:#fff;--shadow:0 1px 2px #5a46280f,0 4px 14px #5a46280d;
  color-scheme:light;
}
body.dark{--bg:#1a1714;--card:#24201b;--card2:#2e2923;--line:#3d352c;--text:#efe7da;--muted:#a39684;
  --accent:#8fb07e;--accent2:#a9c79a;--crust:#d79a5f;--good:#8fb07e;--bad:#e07a62;--onaccent:#14200f;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif}
h1,h2,.serif{font-family:Georgia,'Noto Serif',serif;font-weight:700}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 14px 10px}
header .logo{width:38px;height:38px;border-radius:50%;background:var(--crust);color:#fff8ec;display:grid;place-items:center}
header .logo svg{width:24px;height:24px}
header h1{font-size:21px;margin:0;flex:1;line-height:1.1;letter-spacing:.01em}
header h1 small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.hbtn{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:18px;min-width:36px;height:36px;padding:0 10px;font-size:14px;display:grid;place-items:center}
.hbtn svg{width:18px;height:18px}
.hbtn.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border-top:3px solid var(--crust)}
.card h2{font-size:19px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
label.l{display:block;font-weight:600;margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
label.l:first-child{margin-top:0}
.seg{display:grid;gap:8px}
.seg.c2{grid-template-columns:1fr 1fr}
.seg button,.chips button{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:22px;padding:10px 6px;font-size:14px}
.seg button.on{border-color:var(--accent);background:var(--accent);color:var(--onaccent);font-weight:600}
.chips{display:flex;gap:6px}
.chips button{flex:1;padding:5px 2px;font-size:12px;color:var(--muted)}
.chips button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
input[type=number],input[type=text],select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:11px;font-size:16px;font-family:inherit}
textarea{min-height:90px;resize:vertical}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.slider{display:flex;align-items:center;gap:8px;margin:2px 0 6px}
.slider button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:18px;flex:none}
input[type=range]{flex:1;accent-color:var(--accent);height:28px}
.sh{display:flex;align-items:baseline;gap:8px;margin:18px 0 2px}
.sh .nm{font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sh .vl{margin-left:auto;font:700 22px Georgia,'Noto Serif',serif;color:var(--text)}
.sh .ms{font-size:12px;color:var(--crust);font-style:italic}
.blend .row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.blend select{flex:1;padding:9px}
.blend input{width:76px;flex:none;padding:9px}
.blend .x{background:none;border:none;color:var(--muted);font-size:20px;width:30px}
.blend .tot{font-size:12px;font-weight:600}
.tot.ok{color:var(--good)}.tot.bad{color:var(--bad)}
.lnk{background:none;border:1px dashed var(--line);color:var(--accent);border-radius:22px;padding:8px;width:100%;font-size:14px;margin-top:2px}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 14px;font-size:14px}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:600}
.btn{border-radius:22px}
.btn.sm{padding:6px 10px;font-size:13px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid3 label{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:last-child{text-align:right;font-weight:700;white-space:nowrap;padding-left:8px}
tr.sub td{font-size:13px;color:var(--muted);font-weight:400;padding:2px 0 2px 12px;border:none}
tr.tot td{font-weight:700}
.sec{font-size:11px;letter-spacing:.1em;color:var(--crust);font-weight:700;margin:16px 0 2px}
.warn{background:color-mix(in srgb,var(--bad) 18%,transparent);border:1px solid var(--bad);padding:8px 10px;border-radius:10px;font-size:13px;margin-top:8px}
.summ{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;color:var(--muted)}
.summ b{color:var(--text)}
.steps .st{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.steps .n{width:26px;height:26px;border-radius:50%;background:var(--crust);color:var(--onaccent);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;margin-top:8px}
.steps .b{flex:1;display:flex;flex-direction:column;gap:4px}
.steps .b input,.steps .b textarea{padding:8px;font-size:15px;min-height:0}
.steps .ctl{display:flex;flex-direction:column}
.steps .ctl button{background:none;border:none;color:var(--muted);font-size:16px;width:30px;height:26px}
.saved .it{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.saved .it span{flex:1}
.saved .it small{display:block;color:var(--muted)}
details{border-bottom:1px solid var(--line);padding:10px 0}
details summary{font-weight:600;cursor:pointer}
details p,details li{color:var(--muted);font-size:14px}
details b{color:var(--text)}
.tips p{margin:4px 0;font-size:14px;color:var(--muted)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
#kitchen{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:14px 16px 40px;display:none}
#kitchen.show{display:block}
#kitchen h2{font-size:22px;margin:4px 0 4px}
#kitchen .ki{display:flex;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);font-size:19px}
#kitchen .ki .w{margin-left:auto;font-weight:700;white-space:nowrap}
#kitchen .ki.done{opacity:.4;text-decoration:line-through}
#kitchen .ki .ck{width:26px;height:26px;border-radius:7px;border:2px solid var(--accent);flex:none;display:grid;place-items:center;font-size:16px;color:transparent}
#kitchen .ki.done .ck{background:var(--accent);color:var(--onaccent)}
#kitchen .ki .dsc{display:block;font-size:14px;color:var(--muted)}
#kitchen .kt{display:flex;align-items:center;gap:8px;margin-bottom:10px}
#kitchen .kt .sp{flex:1}
.timer{font-variant-numeric:tabular-nums;font-size:13px;color:var(--crust)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;width:min(92vw,420px)}
dialog::backdrop{background:#0008}
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 22V9"/><path d="M12 9c-3-1-4-4-3-7 3 1 4 4 3 7zM12 9c3-1 4-4 3-7-3 1-4 4-3 7z"/><path d="M12 15c-3-.5-5-3-5-6 3 .3 5 3 5 6zM12 15c3-.5 5-3 5-6-3 .3-5 3-5 6z"/></svg></div>
  <h1 data-t="appName">Levain</h1>
  <button class="hbtn" id="awakeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/></svg></button>
  <button class="hbtn" id="themeBtn"></button>
</header>
<main>

<section class="card">
  <h2><span data-t="calculator">Bread Calculator</span><span class="sp"></span>
    <button class="btn sm" id="resetBtn" data-t="reset">Reset</button>
    <button class="btn sm p" id="shareBtn" data-t="share">Share</button></h2>

  <label class="l" data-t="breadStyle">Bread Style</label>
  <div class="seg c2" id="styleSeg"></div>

  <label class="l" data-t="calcMode">Calculation Mode</label>
  <div class="seg c2" id="modeSeg"></div>

  <label class="l" id="weightLbl"></label>
  <input type="number" id="weight" inputmode="decimal" min="0">
  <div class="hint" id="weightHint"></div>

  <label class="l" data-t="loaves">Recipe Scale (Number of Loaves)</label>
  <input type="number" id="loaves" inputmode="numeric" min="1" step="1">

  <div id="sliders"></div>

  <div id="enriched" style="display:none">
    <label class="l" data-t="enrichedIng">Enriched ingredients (per loaf)</label>
    <div class="grid3">
      <div><label id="butterLbl"></label><input type="number" id="butter" inputmode="decimal" min="0"></div>
      <div><label data-t="eggsCount">Eggs (count)</label><input type="number" id="eggs" inputmode="numeric" min="0" step="1"></div>
      <div><label id="sugarLbl"></label><input type="number" id="sugar" inputmode="decimal" min="0"></div>
    </div>
    <div class="hint" data-t="eggHint">One egg is counted as 50 g.</div>
  </div>

  <label class="l"><span data-t="doughBlend">Dough Flour Blend</span> <span class="tot" id="doughTot"></span></label>
  <div class="blend" id="doughBlend"></div>
  <button class="lnk" id="addDough" data-t="addFlour">+ Add Flour Type</button>

  <label class="l"><span data-t="starterBlend">Starter Flour Mix</span> <span class="tot" id="starterTot"></span></label>
  <div class="blend" id="starterBlend"></div>
  <div class="row2">
    <button class="lnk" style="flex:1" id="addStarter" data-t="addStarterFlour">+ Add Starter Flour</button>
    <button class="lnk" style="flex:1" id="copyBlend" data-t="copyBlend">Copy Dough Blend</button>
  </div>
</section>

<section class="card">
  <h2><span data-t="ingredients">Ingredients</span></h2>
  <div class="summ" id="summ"></div>
  <div id="results"></div>
  <button class="btn p" style="width:100%;margin-top:14px" id="kitchenBtn" data-t="enterKitchen">Enter Kitchen Mode</button>
</section>

<section class="card">
  <h2><span data-t="notes">Recipe Notes &amp; Tips</span></h2>
  <textarea id="notes" data-tp="notesPh"></textarea>
</section>

<section class="card steps">
  <h2><span data-t="steps">Recipe Steps</span> <span id="stepCount" style="color:var(--muted);font-weight:400"></span></h2>
  <div id="stepList"></div>
  <div class="row2"><button class="btn" style="flex:1" id="defaultSteps" data-t="defaultSteps">Use template</button>
    <button class="btn p" style="flex:1" id="addStep" data-t="addStep">Add Step</button></div>
</section>

<section class="card saved">
  <h2><span data-t="saved">Saved Recipes</span><span class="sp"></span>
    <button class="btn sm p" id="saveBtn" data-t="saveCurrent">Save current</button></h2>
  <div id="savedList"></div>
</section>

<section class="card tips">
  <h2><span data-t="quickTips">Quick Tips</span></h2>
  <p data-t="tip1">New to sourdough? Start around 65% hydration.</p>
  <p data-t="tip2">Starter test: a spoonful should float in water when it's ready.</p>
</section>

<section class="card" id="learn">
  <h2><span data-t="learning">Learning Centre</span></h2>
  <div id="learnBody"></div>
</section>
</main>

<div id="kitchen"></div>
<div id="toast"></div>
<dialog id="dlg"><form method="dialog">
  <p id="dlgMsg" style="margin-top:0"></p>
  <input type="text" id="dlgInput">
  <div class="row2" style="justify-content:flex-end;margin-top:12px">
    <button class="btn" value="cancel" data-t="cancel">Cancel</button>
    <button class="btn p" value="ok" data-t="ok">OK</button>
  </div>
</form></dialog>

   ["Hydration Guide",`<ul><li><b>55–65%</b> – stiff and easy to handle; bagels, sandwich loaves, beginners.</li><li><b>65–72%</b> – the classic range for a first sourdough boule.</li><li><b>72–80%</b> – open, glossy crumb; needs good strength and shaping.</li><li><b>80%+</b> – very slack; focaccia, ciabatta, pan breads.</li></ul><p>Whole wheat, rye and spelt absorb more water than white flour – add 5–10% hydration when you use a lot of them. Fresh Tipo 00 for pizza often feels best around 60–68%.</p>`],

const num = v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const pct = v=>(Math.round(v*10)/10).toLocaleString(SV?'sv-SE':'en-US',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
function fmtW(g){
  const d = Math.abs(g)<30 ? 1 : 0;
  return (Math.round(g*10**d)/10**d).toLocaleString(SV?'sv-SE':'en-US',{maximumFractionDigits:d})+' g';
}

/* ---------- calculation ---------- */
function normBlend(b){const tot=b.reduce((a,[,p])=>a+num(p),0);return {tot,parts:tot>0?b.map(([f,p])=>[f,num(p)/tot]):[['bread',1]]}}
function calc(){
  const n=Math.max(1,Math.round(num(S.loaves))||1);
  const h=S.hydration/100, s=S.starter/100, sh=S.starterHyd/100, salt=S.salt/100;
  const oil=(S.style==='focaccia'||S.style==='pizza')?S.oil/100:0;
  const enr=S.style==='enriched';
  const butter=enr?num(S.butter):0, eggs=enr?Math.max(0,Math.round(num(S.eggs))):0, sugar=enr?num(S.sugar):0;
  const eggW=eggs*50, extras=butter+eggW+sugar;
  let F = S.mode==='dough' ? (num(S.weight)-extras)/(1+h+salt+oil) : num(S.flourWeight);
  const tooHeavy = S.mode==='dough' && F<=0;
  F=Math.max(0,F)*n;
  const starter=F*s, sFlour=starter/(1+sh), sWater=starter-sFlour;
  const flourAdd=F-sFlour, water=F*h, waterAdd=water-sWater;
  const r={n,F,starter,sFlour,sWater,flourAdd,water,waterAdd,salt:F*salt,oil:F*oil,butter:butter*n,eggs:eggs*n,eggW:eggW*n,sugar:sugar*n,tooHeavy};
  r.total=F+water+r.salt+r.oil+r.butter+r.eggW+r.sugar;
  r.dough=normBlend(S.doughBlend); r.starterB=normBlend(S.starterBlend);
  // flour breakdown to add = dough blend of total flour minus starter's flour per type
  const want={},have={};
  for(const[f,p]of r.dough.parts)want[f]=(want[f]||0)+p*F;
  for(const[f,p]of r.starterB.parts)have[f]=(have[f]||0)+p*sFlour;
  // if starter flour types can't be subtracted (not in dough blend), just apply dough blend to flour-to-add
  const ok=Object.keys(have).every(f=>(want[f]||0)>=have[f]-1e-6);
  r.flourLines = ok ? Object.keys(want).map(f=>[f,want[f]-(have[f]||0)]).filter(([,g])=>g>0.05)
                    : r.dough.parts.map(([f,p])=>[f,p*flourAdd]);
  return r;
}

    const upd=()=>{valEl.textContent=pct(S[k]);msgEl.textContent=msgFor(sliderMsgs(k),S[k]);
      [...chips.children].forEach(c=>c.classList.toggle('on',+c.dataset.v===S[k]))};

function renderBlend(key,boxId,totId){
  const box=$(boxId);box.innerHTML='';
  const b=S[key];
  b.forEach((row,i)=>{
    const sel=el('select',{on:{change:e=>{row[0]=e.target.value;renderResults()}}});
    for(const f of FLOURS)sel.append(el('option',{value:f,textContent:L.flours[f],selected:f===row[0]}));
    const inp=el('input',{type:'number',inputmode:'decimal',min:0,max:100,value:row[1],on:{input:e=>{row[1]=num(e.target.value);updTot();renderResults()}}});
    box.append(el('div',{className:'row'},sel,inp,el('span',{textContent:'%'}),
      b.length>1?el('button',{className:'x',textContent:'×',on:{click:()=>{b.splice(i,1);rebalance(b);renderBlend(key,boxId,totId);renderResults()}}}):el('span',{style:'width:30px'})));
  });
  const updTot=()=>{const t=b.reduce((a,[,p])=>a+num(p),0);const e=$(totId);e.textContent=pct(t);e.className='tot '+(Math.abs(t-100)<0.05?'ok':'bad')};
  updTot();
}
function rebalance(b){const t=b.reduce((a,[,p])=>a+num(p),0);if(t>0&&b.length)b[b.length-1][1]=+Math.max(0,num(b[b.length-1][1])+100-t).toFixed(1)}
function addFlour(key){
  const b=S[key];const used=new Set(b.map(r=>r[0]));const f=FLOURS.find(x=>!used.has(x))||'bread';
  const take=Math.min(20,num(b[0][1]));b[0][1]=+(num(b[0][1])-take).toFixed(1);b.push([f,take]);
}

/* ---------- render: results ---------- */
function renderResults(){
  persist();
  const r=calc(), box=$('results');box.innerHTML='';
  $('weightHint').textContent=S.mode==='dough'?L.perLoaf(fmtW(num(S.weight))):L.perLoaf(fmtW(r.n?r.total/r.n:0));
  $('summ').innerHTML='';
  for(const[k,v]of[[L.style,L[S.style]],[L.hydration,pct(S.hydration)],[L.starterPct,pct(S.starter)],[L.starterHyd,pct(S.starterHyd)],[L.salt,pct(S.salt)]].concat(r.oil?[[L.oilPct,pct(S.oil)]]:[]))
    $('summ').append(el('div',{},k+': ',el('b',{textContent:v})));
  const t=el('table');
  const row=(a,b,cls)=>t.append(el('tr',{className:cls||''},el('td',{textContent:a}),el('td',{textContent:b})));
  const sec=s=>t.append(el('tr',{},el('td',{colSpan:2,className:'sec',textContent:s})));
  sec(L.toAdd);
  for(const[f,g]of r.flourLines)row(L.flours[f],fmtW(g));
  if(r.flourLines.length>1)row(L.totalFlourAdd,fmtW(r.flourAdd),'tot');
  row(L.waterAdd,fmtW(r.waterAdd));
  row(L.starter,fmtW(r.starter));
  row(L.starterHas(fmtW(r.sWater),fmtW(r.sFlour),S.starterHyd),'','sub');
  if(r.starterB.parts.length>1)for(const[f,p]of r.starterB.parts)row('· '+L.flours[f],fmtW(p*r.sFlour),'sub');
  row(L.saltI,fmtW(r.salt));
  if(r.oil)row(L.oil,fmtW(r.oil));
  if(S.style==='enriched'){if(r.butter)row(L.butter,fmtW(r.butter));if(r.eggs)row(L.eggs,L.eggN(r.eggs,fmtW(r.eggW)));if(r.sugar)row(L.sugar,fmtW(r.sugar))}
  sec(L.summary);
  row(L.totalFlour,fmtW(r.F));row(L.totalWater,fmtW(r.water));row(L.saltI,fmtW(r.salt));
  row(L.totalWeight,fmtW(r.total),'tot');
  sec(L.bakers);
  const bp=x=>r.F>0?pct(x/r.F*100):'–';
  row(L.flour,pct(100));row(L.doughWater,pct(S.hydration));row(L.starter,pct(S.starter));row(L.saltI,pct(S.salt));
  if(r.oil)row(L.oil,pct(S.oil));
  if(S.style==='enriched'){if(r.butter)row(L.butter,bp(r.butter));if(r.eggs)row(L.eggs,bp(r.eggW));if(r.sugar)row(L.sugar,bp(r.sugar))}
  box.append(t);
  if(r.tooHeavy)box.append(el('div',{className:'warn',textContent:L.tooHeavy}));
  if(r.waterAdd<-0.5)box.append(el('div',{className:'warn',textContent:L.negWater}));
  if(Math.abs(r.dough.tot-100)>0.05||Math.abs(r.starterB.tot-100)>0.05)box.append(el('div',{className:'warn',textContent:L.blendWarn}));
}

function renderSaved(){
  const box=$('savedList');box.innerHTML='';const list=getSaved();

  list.forEach((rec,i)=>{
    const s=rec.state;
    box.append(el('div',{className:'it'},el('span',{},rec.name,el('small',{textContent:`${L[s.style]} · ${pct(s.hydration)} · ${new Date(rec.date).toLocaleDateString(SV?'sv-SE':undefined)}`})),
      el('button',{className:'btn sm p',textContent:L.load,on:{click:()=>{S=Object.assign(freshState(s.style),JSON.parse(JSON.stringify(s)));renderAll();toast(L.loadedOk);window.scrollTo({top:0,behavior:'smooth'})}}}),
      el('button',{className:'btn sm',textContent:L.del,on:{click:async()=>{if(await ask(L.deleteQ(rec.name))){const l=getSaved();l.splice(i,1);store('sd_saved',l);renderSaved()}}}})));
  });

async function saveCurrent(){
  const name=await ask(L.recipeName,true,L[S.style]+' '+pct(S.hydration));if(!name)return;
  const l=getSaved();const ex=l.findIndex(r=>r.name===name);
  const rec={name,date:Date.now(),state:JSON.parse(JSON.stringify(S))};
  if(ex>=0){if(!await ask(L.overwriteQ(name)))return;l[ex]=rec}else l.unshift(rec);
  store('sd_saved',l);renderSaved();toast(L.savedOk);
}

function recipeText(){
  const r=calc();const lines=[`${L.appName} – ${L[S.style]}`,''];
  lines.push(`${L.hydration}: ${pct(S.hydration)} · ${L.starterPct}: ${pct(S.starter)} · ${L.starterHyd}: ${pct(S.starterHyd)} · ${L.salt}: ${pct(S.salt)}`+(r.oil?` · ${L.oilPct}: ${pct(S.oil)}`:''));
  lines.push('',L.ingredients+':');
  for(const[f,g]of r.flourLines)lines.push(`• ${L.flours[f]}: ${fmtW(g)}`);
  lines.push(`• ${L.waterAdd}: ${fmtW(r.waterAdd)}`,`• ${L.starter}: ${fmtW(r.starter)}`,`• ${L.saltI}: ${fmtW(r.salt)}`);
  if(r.oil)lines.push(`• ${L.oil}: ${fmtW(r.oil)}`);
  if(S.style==='enriched'){if(r.butter)lines.push(`• ${L.butter}: ${fmtW(r.butter)}`);if(r.eggs)lines.push(`• ${L.eggs}: ${L.eggN(r.eggs,fmtW(r.eggW))}`);if(r.sugar)lines.push(`• ${L.sugar}: ${fmtW(r.sugar)}`)}
  lines.push('',`${L.totalFlour}: ${fmtW(r.F)}`,`${L.totalWater}: ${fmtW(r.water)}`,`${L.totalWeight}: ${fmtW(r.total)}`+(r.n>1?` (${r.n} × ${fmtW(r.total/r.n)})`:''));
  if(S.steps.length){lines.push('',L.steps+':');S.steps.forEach((s,i)=>lines.push(`${i+1}. ${s.t||L.stepTitle+' '+(i+1)}${s.m?` (${s.m} ${L.stepMin})`:''}${s.d?' – '+s.d:''}`))}
  if(S.notes.trim())lines.push('',L.notes+':',S.notes.trim());
  return lines.join('\n');
}
function share(){
  const txt=recipeText();
  if(native&&native.share)native.share(txt,L.appName);
  else if(navigator.share)navigator.share({text:txt}).catch(()=>{});
  else navigator.clipboard?.writeText(txt).then(()=>toast(L.copied));
}

/* ---------- kitchen mode ---------- */
let timers={};
function openKitchen(){
  const r=calc(), k=$('kitchen');k.innerHTML='';k.classList.add('show');history.pushState({k:1},'');
  setAwake(true,true);
  k.append(el('div',{className:'kt'},el('h2',{textContent:L.kitchen}),el('span',{className:'sp'}),el('button',{className:'btn',textContent:L.exit,on:{click:()=>history.back()}})));
  k.append(el('div',{className:'hint',textContent:`${L[S.style]} · ${fmtW(r.total)} · ${L.check}`}));
  const item=(name,w,dsc,mins)=>{
    const tm=mins?el('span',{className:'timer'}):null;
    const it=el('div',{className:'ki',on:{click:e=>{if(e.target.closest('button'))return;it.classList.toggle('done')}}},el('span',{className:'ck',textContent:'✓'}),el('span',{},name,dsc?el('span',{className:'dsc',textContent:dsc}):null,tm),w?el('span',{className:'w',textContent:w}):null);
    if(mins){const b=el('button',{className:'btn sm',textContent:'⏱ '+mins+' '+L.stepMin,on:{click:()=>startTimer(name,mins,tm,b)}});it.append(b)}
    k.append(it);
  };
  k.append(el('div',{className:'sec',textContent:L.ingredients.toUpperCase()}));
  for(const[f,g]of r.flourLines)item(L.flours[f],fmtW(g));
  item(L.waterAdd,fmtW(r.waterAdd));
  item(L.starter,fmtW(r.starter),L.starterHas(fmtW(r.sWater),fmtW(r.sFlour),S.starterHyd));
  item(L.saltI,fmtW(r.salt));
  if(r.oil)item(L.oil,fmtW(r.oil));
  if(S.style==='enriched'){if(r.butter)item(L.butter,fmtW(r.butter));if(r.eggs)item(L.eggs,L.eggN(r.eggs,fmtW(r.eggW)));if(r.sugar)item(L.sugar,fmtW(r.sugar))}
  if(S.steps.length){k.append(el('div',{className:'sec',textContent:L.steps.toUpperCase()}));
    S.steps.forEach((s,i)=>item(`${i+1}. ${s.t||L.stepTitle+' '+(i+1)}`,'',s.d,s.m))}
  if(S.notes.trim())k.append(el('div',{className:'sec',textContent:L.notes.toUpperCase()}),el('p',{style:'white-space:pre-wrap;color:var(--muted)',textContent:S.notes}));
}
function startTimer(name,mins,out,btn){
  if(native&&native.startTimer){native.startTimer(name,mins*60);}
  clearInterval(timers[name]);const end=Date.now()+mins*60000;btn.style.display='none';
  const tick=()=>{const s=Math.max(0,Math.round((end-Date.now())/1000));const h=Math.floor(s/3600),m=Math.floor(s/60)%60,ss=s%60;
    out.textContent=' ⏱ '+(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(ss).padStart(2,'0');if(!s){clearInterval(timers[name]);out.textContent=' ✅'}};
  tick();timers[name]=setInterval(tick,1000);
}
function closeKitchen(){$('kitchen').classList.remove('show');setAwake(prefs.awake,true)}
window.addEventListener('popstate',()=>{if($('kitchen').classList.contains('show'))closeKitchen()});

/* ---------- prefs ---------- */
let wakeLock=null;
async function setAwake(on,silent){
  if(native&&native.keepAwake)native.keepAwake(!!on);
  else if('wakeLock' in navigator){try{if(on&&!wakeLock)wakeLock=await navigator.wakeLock.request('screen');else if(!on&&wakeLock){wakeLock.release();wakeLock=null}}catch(e){}}
  if(!silent)toast(on?L.awakeOn:L.awakeOff);
}
const THEME_ICON={auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
 light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/></svg>'};
const isDark=()=>prefs.theme==='dark'||(prefs.theme==='auto'&&systemDark);
window.onSystemTheme=d=>{systemDark=!!d;applyPrefs()};
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{if(!(native&&native.isSystemDark)){systemDark=e.matches;applyPrefs()}})}catch(e){}
function applyPrefs(){
  document.body.classList.toggle('dark',isDark());
  $('themeBtn').innerHTML=THEME_ICON[prefs.theme];$('themeBtn').setAttribute('aria-label',L.themeNames[prefs.theme]);
  $('awakeBtn').classList.toggle('on',prefs.awake);
  if(native&&native.setDark)native.setDark(isDark());
  store('sd_prefs',prefs);
}

/* ---------- wiring ---------- */
function renderAll(){applyI18n();renderSeg();renderWeight();renderSliders();renderBlend('doughBlend','doughBlend','doughTot');renderBlend('starterBlend','starterBlend','starterTot');renderResults();renderSteps();$('notes').value=S.notes;renderSaved()}
$('weight').addEventListener('input',e=>{const g=fromUnit(e.target.value);if(S.mode==='dough')S.weight=g;else S.flourWeight=g;renderResults()});
$('loaves').addEventListener('input',e=>{S.loaves=Math.max(1,Math.round(num(e.target.value))||1);renderResults()});
$('butter').addEventListener('input',e=>{S.butter=fromUnit(e.target.value);renderResults()});
$('sugar').addEventListener('input',e=>{S.sugar=fromUnit(e.target.value);renderResults()});
$('eggs').addEventListener('input',e=>{S.eggs=Math.max(0,Math.round(num(e.target.value)));renderResults()});
$('notes').addEventListener('input',e=>{S.notes=e.target.value;persist()});
$('addDough').onclick=()=>{addFlour('doughBlend');renderBlend('doughBlend','doughBlend','doughTot');renderResults()};
$('addStarter').onclick=()=>{addFlour('starterBlend');renderBlend('starterBlend','starterBlend','starterTot');renderResults()};
$('copyBlend').onclick=()=>{S.starterBlend=JSON.parse(JSON.stringify(S.doughBlend));renderBlend('starterBlend','starterBlend','starterTot');renderResults()};
$('resetBtn').onclick=async()=>{if(await ask(L.resetQ)){const keep={notes:S.notes,steps:S.steps};S=Object.assign(freshState(S.style),keep);renderAll()}};
$('shareBtn').onclick=share;
$('kitchenBtn').onclick=openKitchen;
$('addStep').onclick=()=>{S.steps.push({t:'',d:'',m:0});renderSteps();persist();const ins=$('stepList').querySelectorAll('input[type=text]');ins[ins.length-1]?.focus()};
$('defaultSteps').onclick=()=>{for(const[t,d,m]of L.template)S.steps.push({t,d,m:m||0});renderSteps();persist()};
$('saveBtn').onclick=saveCurrent;
$('themeBtn').onclick=()=>{prefs.theme={auto:'light',light:'dark',dark:'auto'}[prefs.theme]||'auto';applyPrefs();toast(L.themeNames[prefs.theme])};
$('awakeBtn').onclick=()=>{prefs.awake=!prefs.awake;applyPrefs();setAwake(prefs.awake)};
for(const[h,body]of L.learn){const d=el('details',{},el('summary',{textContent:h}));const c=el('div');c.innerHTML=body;d.append(c);$('learnBody').append(d)}
if(native&&native.isSystemDark)systemDark=native.isSystemDark();
applyPrefs();renderAll();if(prefs.awake)setAwake(true,true);
</script>
